<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Confirmar asistencia · Human Prime Lab</title>
  <meta name="theme-color" content="#0a0a0a">
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Unbounded:wght@300;400;500;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <style>
    .confirm { width: min(460px, 100%); margin: 0 auto; padding: 56px 20px; text-align: center; }
    .confirm .logo-mark { width: 54px; margin: 0 auto 26px; }
    .confirm h1 { font-size: 15px; margin-bottom: 10px; }
    .confirm p { color: var(--muted); font-size: 14px; margin: 0 0 22px; }
    .confirm .card { padding: 18px; margin-bottom: 22px; text-align: left; font-size: 14px; display: grid; gap: 8px; }
    .confirm .card span { color: var(--muted); }
    .confirm .actions { display: flex; flex-direction: column; gap: 10px; }
    .confirm .icon-ok { width: 62px; height: 62px; margin: 0 auto 18px; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--gold); color: var(--gold); background: rgba(var(--gold-rgb), .1); }
    .confirm .icon-ok svg { width: 28px; height: 28px; }
  </style>
</head>
<body>
  <main class="confirm" id="box"></main>
  <script type="module" src="js/confirmar.js"></script>
</body>
</html>
