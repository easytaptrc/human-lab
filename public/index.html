<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Human Prime Lab</title>
  <meta name="description" content="Human Prime Lab — Entrenamiento, salud y rendimiento en un solo lugar.">
  <meta name="theme-color" content="#0a0a0a">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Unbounded:wght@300;400;500;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/index.css">
</head>
<body>
  <header class="site-header" id="header"></header>

  <nav class="drawer" id="drawer" aria-hidden="true">
    <div class="drawer-panel">
      <button class="icon-btn drawer-close" id="drawerClose" aria-label="Cerrar menú"></button>
      <div class="drawer-links" id="drawerLinks"></div>
      <div class="socials" id="drawerSocials"></div>
    </div>
  </nav>

  <main id="app">
    <section class="hero" id="hero">
      <div class="hero-media" id="heroMedia"></div>
      <div class="hero-content" id="heroContent"></div>
    </section>
    <section class="claim" id="claim" hidden></section>
    <section class="section" id="servicios" hidden></section>
    <section class="section" id="contacto" hidden></section>
  </main>

  <footer class="site-footer" id="footer"></footer>

  <script type="module" src="js/index.js"></script>
</body>
</html>
