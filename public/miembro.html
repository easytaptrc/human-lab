<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Miembros · Human Prime Lab</title>
  <meta name="theme-color" content="#0a0a0a">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Unbounded:wght@300;400;500;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/miembro.css">
</head>
<body>
  <header class="site-header" id="header"></header>

  <main>
    <!-- Acceso -->
    <section class="login" id="login" hidden>
      <div class="login-media" id="loginMedia"></div>
      <div class="login-box">
        <h1 class="title-wide login-title">Acceso<br>miembro</h1>
        <p class="login-text">Ingresa con tu ID de socio para ver tu membresía, tus reservas y los mensajes del gimnasio.</p>
        <form id="loginForm" class="login-form" novalidate>
          <label class="input-icon"><svg></svg><input class="input" name="memberId" placeholder="ID de socio (ej. HPL-0001)" autocapitalize="characters" autocomplete="username" required></label>
          <label class="input-icon pass"><svg></svg><input class="input" name="last4" type="password" inputmode="numeric" maxlength="4" placeholder="Últimos 4 dígitos de tu teléfono" autocomplete="current-password" required><button type="button" class="icon-btn eye" aria-label="Mostrar"></button></label>
          <div class="login-row">
            <label class="check"><input type="checkbox" name="remember" checked> Recordarme</label>
            <a id="forgot" href="#" target="_blank" rel="noopener">¿Olvidaste tu ID?</a>
          </div>
          <button class="btn btn-gold btn-block" type="submit" id="loginBtn"><span>Iniciar sesión</span><span class="btn-chev"></span></button>
        </form>
      </div>
    </section>

    <!-- Perfil -->
    <section class="profile wrap" id="profile" hidden></section>
  </main>

  <script type="module" src="js/miembro.js"></script>
</body>
</html>
